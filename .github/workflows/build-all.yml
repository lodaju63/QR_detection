name: Build Windows & Mac Executables

on:
  push:
    branches:
      - feat/PyQt6
      - main
  pull_request:
    branches:
      - feat/PyQt6
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install PyTorch CPU
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      
      - name: Install dependencies
        run: |
          pip install -r requirements_pyqt.txt
          pip install -r build_requirements.txt
      
      - name: Build Windows executable
        run: |
          pyinstaller --clean qr_analyzer_onefile.spec
      
      - name: Check build result
        run: |
          if (Test-Path "dist\QR_Analyzer.exe") {
            Write-Host "Build successful!"
            Get-Item "dist\QR_Analyzer.exe" | Select-Object Name, Length
          } else {
            Write-Host "Build failed!"
            exit 1
          }
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR_Analyzer-Windows
          path: dist/QR_Analyzer.exe
          retention-days: 30

  build-mac:
    name: Build Mac Executable
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install PyTorch CPU
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      
      - name: Install dependencies
        run: |
          pip install -r requirements_pyqt.txt
          pip install -r build_requirements.txt
      
      - name: Build Mac executable
        run: |
          pyinstaller --clean qr_analyzer_onefile_mac.spec
      
      - name: Check build result
        run: |
          if [ -d "dist/QR_Analyzer.app" ]; then
            echo "Build successful!"
            ls -lh dist/QR_Analyzer.app
          else
            echo "Build failed!"
            exit 1
          fi
      
      - name: Create DMG (optional)
        run: |
          if [ -d "dist/QR_Analyzer.app" ]; then
            hdiutil create -volname "QR_Analyzer" -srcfolder "dist/QR_Analyzer.app" -ov -format UDZO "dist/QR_Analyzer.dmg"
          fi
      
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR_Analyzer-Mac
          path: |
            dist/QR_Analyzer.app
            dist/QR_Analyzer.dmg
          retention-days: 30
