name: Build Android APK (Chaquopy)

# Trigger rebuild
on:
  push:
    branches: [ main, master, feat/PyQt6 ]
    paths:
      - 'chaquopy_qr_scanner/**'
  workflow_dispatch:

# 중복 빌드 방지: 같은 브랜치의 동시 빌드는 취소
concurrency:
  group: build-android-chaquopy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x chaquopy_qr_scanner/gradlew || true
    
    - name: Setup Gradle Wrapper
      working-directory: ./chaquopy_qr_scanner
      run: |
        # Gradle wrapper jar가 없으면 다운로드
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi
        chmod +x gradlew
        chmod +x gradle/wrapper/gradle-wrapper.jar || true
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.2
        cache-read-only: false
    
    - name: Build with Gradle
      working-directory: ./chaquopy_qr_scanner
      run: |
        # Gradle wrapper 확인
        ls -la gradle/wrapper/ || true
        # 빌드 실행
        bash gradlew assembleDebug --no-daemon
    
    - name: Check build result
      working-directory: ./chaquopy_qr_scanner
      run: |
        if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
          echo "✅ Android build successful!"
          ls -lh app/build/outputs/apk/debug/*.apk
        else
          echo "❌ Build failed!"
          exit 1
        fi
    
    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: QR_Scanner_Chaquopy_APK
        path: chaquopy_qr_scanner/app/build/outputs/apk/debug/*.apk
        retention-days: 7
        compression-level: 6
