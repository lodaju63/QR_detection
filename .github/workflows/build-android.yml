name: Build Android APK

on:
  push:
    branches: [ main, master, feat/PyQt6 ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean git config
      run: |
        git config --global --unset http.https://github.com/.extraheader || true
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          unzip \
          openjdk-11-jdk \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          gettext \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          python3-pip \
          python3-venv \
          build-essential
    
    - name: Create virtual environment
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install buildozer cython
      env:
        PIP_BREAK_SYSTEM_PACKAGES: 1
    
    - name: Install Python dependencies
      run: |
        source venv/bin/activate
        pip install -r requirements_android.txt
      env:
        PIP_BREAK_SYSTEM_PACKAGES: 1
    
    - name: Clean Buildozer cache
      run: |
        rm -rf .buildozer
        rm -rf bin
        echo "Buildozer cache cleaned"
    
    - name: Build Android APK
      timeout-minutes: 120
      run: |
        source venv/bin/activate
        # Unset conflicting Android NDK environment variables
        export ANDROID_NDK=""
        export ANDROID_NDK_HOME=""
        export ANDROID_NDK_ROOT=""
        export ANDROID_NDK_LATEST_HOME=""
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        PIP_BREAK_SYSTEM_PACKAGES: 1
        ANDROID_NDK: ""
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK_LATEST_HOME: ""
    
    - name: Check build result
      run: |
        if ls bin/*.apk 1> /dev/null 2>&1; then
          echo "✅ Android build successful!"
          ls -lh bin/*.apk
        else
          echo "❌ Build failed!"
          exit 1
        fi
    
    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: QR_Analyzer_Android
        path: bin/*.apk
        retention-days: 7
        compression-level: 6
